# Keeps the free Supabase project awake (it pauses after 7 days without activity).
# Runs every 2 days in GitHub's cloud, so it works even when the PC is off. A failed run emails the repo owner.
# Once a month it commits a date stamp, because GitHub stops scheduled runs in a repo with no commits for 60 days.
name: keepalive
on:
  schedule:
    - cron: '17 5 */2 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the server
        run: |
          URL=$(grep -o '"url": *"[^"]*"' config.js | sed 's/.*"\(https[^"]*\)"/\1/')
          ANON=$(grep -o '"anon": *"[^"]*"' config.js | sed 's/.*"anon": *"\([^"]*\)"/\1/')
          for i in 1 2 3; do
            R=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H 'Content-Type: application/json' -d '{}')
            echo "attempt $i: HTTP $R $(cat /tmp/out)"
            [ "$R" = "200" ] && exit 0
            sleep 60
          done
          echo "::error::The Magerot BI server did not answer. It may be paused: open supabase.com/dashboard and press Restore."
          exit 1
      - name: Monthly date stamp
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date +%d)" -le 2 ]; then
            date -u +%Y-%m-%d > last-keepalive.txt
            git config user.name 'keepalive'; git config user.email 'keepalive@users.noreply.github.com'
            git add last-keepalive.txt && git commit -m 'keepalive stamp' && git push || true
          fi
